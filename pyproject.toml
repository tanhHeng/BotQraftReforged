[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "botqraft"
dynamic = ["version", "dependencies"]
description = "Independent QQ bot framework using native MCDReforged plugin and command primitives"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[project.scripts]
botqraft = "botqraft.entrypoint:entrypoint"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "botqraft.constants.core_constant.VERSION" }
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = ["botqraft", "botqraft.*"]
namespaces = false

[tool.setuptools.package-data]
botqraft = ["py.typed", "resources/*.yml", "resources/lang/*.yml"]
